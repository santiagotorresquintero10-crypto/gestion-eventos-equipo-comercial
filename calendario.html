<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario – Gestión de Eventos | Equipo Comercial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">

    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="img/logo.png" alt="Central Ganadera S.A.">
        <div class="sidebar-titulo">
          <h1>GESTIÓN DE EVENTOS</h1>
          <p>Equipo Comercial</p>
        </div>
      </div>
      <ul class="sidebar-nav">
        <li><a href="index.html">📊 Dashboard</a></li>
        <li><a href="eventos.html">📅 Próximos eventos</a></li>
        <li><a href="calendario.html" class="activo">🗓️ Calendario</a></li>
        <li><a href="historico.html">🗂️ Histórico</a></li>
      </ul>
      <div class="sidebar-footer">Central Ganadera S.A.</div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Calendario</h2>
          <p>Vista mensual de todos los eventos programados.</p>
        </div>
        <div class="page-header-acciones">
          <div id="alertas-root"></div>
          <button id="btn-nuevo-evento" class="btn-primario">+ Nuevo evento</button>
        </div>
      </div>

      <div class="calendario-controles">
        <button id="btn-mes-anterior">← Mes anterior</button>
        <h3 id="calendario-titulo">—</h3>
        <div style="display:flex; gap:8px;">
          <button id="btn-hoy">Hoy</button>
          <button id="btn-mes-siguiente">Mes siguiente →</button>
        </div>
      </div>

      <div class="barra-clasificacion">
        <div class="chips-rapidos">
          <button class="chip-clasificacion activo" data-clasificacion="todos">Todos</button>
          <button class="chip-clasificacion" data-clasificacion="nacional">Nacionales</button>
          <button class="chip-clasificacion" data-clasificacion="internacional">Internacionales</button>
        </div>
        <div class="leyenda-clasificacion">
          <span><span class="punto-clasificacion punto-nacional"></span> Nacional</span>
          <span><span class="punto-clasificacion punto-internacional"></span> Internacional</span>
        </div>
      </div>

      <div class="calendario-layout">
        <div class="calendario-grid" id="calendario-grid"></div>
        <div class="panel-dia" id="panel-dia-eventos"></div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/calendario.js"></script>
</body>
</html>
